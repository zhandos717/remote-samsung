<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки ТВ</title>
  <meta name="theme-color" content="#0b0b0d">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <header class="bar">
      <a class="settings-link" href="index.html">← Пульт</a>
      <h1>Настройки ТВ</h1>
    </header>

    <section class="connect">
      <label for="ipInput">IP телевизора</label>
      <div class="row">
        <input id="ipInput" type="text" inputmode="decimal" value="192.168.0." placeholder="192.168.0.X" autocomplete="off" spellcheck="false">
        <button id="connectBtn" class="primary">Подключить</button>
      </div>
      <div class="status" id="status">Не подключено</div>
      <p class="hint">Адрес указан в настройках сети ТВ или в роутере. Если ТВ спросит разрешение, нажмите «Разрешить».</p>
    </section>

    <section class="connect">
      <label>Приложение</label>
      <div class="row">
        <button id="checkUpdateBtn" class="primary">Проверить обновления</button>
        <button id="applyUpdateBtn" class="primary" hidden>Установить</button>
      </div>
      <div class="status" id="updateStatus">Версия: установлена</div>
    </section>

    <section class="foot">
      <button id="forgetBtn" class="ghost">Забыть ТВ</button>
    </section>
  </main>

  <script src="tv.js"></script>
  <script src="update.js"></script>
  <script src="settings.js"></script>
  <script>Updater.init();</script>
</body>
</html>
